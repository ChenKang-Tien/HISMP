services:
    # ==========================================
    # 1. 核心網頁服務 (Laravel + PHP 8.4 + Node)
    # ==========================================
    webserver:
        build: .
        container_name: laravel-integrated-app
        restart: always
        user: "root"
        ports:
            - "8000:8000"
            - "5173:5173"
        volumes:
            - .:/app
        working_dir: /app
        environment:
            - DB_HOST=database
            - DB_PORT=3306
            - DB_DATABASE=HISMP # 👈 修正為 HISMP 以對應既有資料庫
            - DB_USERNAME=hcis # 👈 統一為你的使用者帳號 hcis
            - DB_PASSWORD=Hcis_1110 # 👈 統一為你的密碼
        command: php artisan serve --host=0.0.0.0 --port=8000
        depends_on:
            - database
        networks:
            - app-network

    # ==========================================
    # 2. 資料庫服務 (MySQL 8.0)
    # ==========================================
    database:
        image: mysql:8.0
        container_name: mysql-database
        restart: always
        ports:
            - "3306:3306"
        environment:
            - MYSQL_ROOT_PASSWORD=Hcis_1110 # 👈 最高管理員密碼
            - MYSQL_DATABASE=HISMP # 👈 保持 HISMP 資料庫名稱
            - MYSQL_USER=hcis # 👈 建立普通帳號 hcis
            - MYSQL_PASSWORD=Hcis_1110 # 👈 設定普通帳號密碼
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - app-network

    # ==========================================
    # 3. 資料庫可視化管理工具 (phpMyAdmin)
    # ==========================================
    phpmyadmin:
        image: phpmyadmin:latest
        container_name: phpmyadmin-dashboard
        restart: always
        ports:
            - "8080:80"
        environment:
            - PMA_HOST=database
            - PMA_PORT=3306
            # 💡 這裡不硬寫帳密，你在網頁輸入 hcis / Hcis_1110 或 root / Hcis_1110 都能順利登入
        depends_on:
            - database
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    db-data:
        driver: local
